[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "slow: tests >1s (Vosk/FastEmbed warmup)",
    "qt: requires QCoreApplication instance",
    "network: requires internet access",
    "ollama: requires running ollama daemon",
]
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:fastembed.*",
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
source = ["akali"]
omit = ["akali/ui/*", "akali/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
