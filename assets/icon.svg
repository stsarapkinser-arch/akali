<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b3aa6"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- soft shadow background -->
  <circle cx="128" cy="128" r="118" fill="url(#bg)"/>
  <!-- inner ring (highlight) -->
  <circle cx="128" cy="128" r="118" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <!-- microphone body -->
  <g transform="translate(0,-6)">
    <rect x="108" y="60" width="40" height="76" rx="20" ry="20" fill="#ffffff" opacity="0.95"/>
    <!-- mic stand bracket -->
    <path d="M82,128 a46,46 0 0 0 92,0" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <!-- post -->
    <rect x="125" y="170" width="6" height="20" fill="#ffffff" opacity="0.9"/>
    <!-- base -->
    <rect x="100" y="190" width="56" height="8" rx="3" ry="3" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- subtle dot accent -->
  <circle cx="128" cy="78" r="6" fill="#7c4dff" opacity="0.6"/>
</svg>
